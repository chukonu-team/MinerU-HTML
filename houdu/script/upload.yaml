apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: upload-html
  namespace: houdu
spec:
  selector:
    matchLabels:
      name: upload-html-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: upload-html-ds
    spec:
      containers:
      - name: upload-html-container  # 添加了容器名称
        image: 10.100.1.1:5000/mineru:2.6.4
        imagePullPolicy: Always
        command: [ "python3", "/data/MinerU-HTML/houdu/main/upload.py" ]
        env:
          - name: AWS_ACCESS_KEY_ID
            value: "******"
          - name: AWS_SECRET_ACCESS_KEY
            value: "******"
          - name: AWS_DEFAULT_REGION
            value: "cn-hangzhou"
          - name: AWS_ENDPOINT
            value: "https://obs.cn-north-4.myhuaweicloud.com"
          - name: S3_TYPE
            value: "oss"
          - name: S3_BUCKET
            value: "houdu-dataservice"
          - name: RESULT_KEY
            value: cc/mb_cc/mineru_html
          - name: MAX_PROCESSES
            value: "4"
          - name: THREADS_PER_PROCESS
            value: "50"
        resources:
          limits:
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "8Gi"
            cpu: "4"
        volumeMounts:
        - name: scripts
          mountPath: /data/MinerU-HTML
        - name: mnt
          mountPath: /mnt
      volumes:
      - name: scripts
        hostPath:
          path: /data/MinerU-HTML
      - name: mnt
        hostPath:
          path: /ssd/cc_html
          type: DirectoryOrCreate
      nodeSelector:
        app1: html1
